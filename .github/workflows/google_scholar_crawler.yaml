name: Update Scholar Citations

on:
  # Archived: citations are now verified manually from Google Scholar PDFs.
  # Keep only an explicit trigger for possible future troubleshooting.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-citation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test snapshot safety
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v
      - name: Refresh citations
        run: python google_scholar_crawler/update.py
      - name: Save validated snapshot
        run: |
          if ! git diff --quiet -- _data/google_scholar_citations.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _data/google_scholar_citations.yml
            git commit -m 'Update Google Scholar citation snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages
        # A push made with GITHUB_TOKEN does not trigger the usual Pages build.
        # Request a build explicitly, also allowing a manual retry after failure.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
