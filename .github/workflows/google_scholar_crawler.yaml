name: Update Scholar Citations

on:
  schedule:
    - cron: '0 0 * * 1'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-citation-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test snapshot safety
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v
      - name: Refresh citations
        # scholarly retries can wait a long time when Scholar blocks a runner.
        run: timeout 180s python google_scholar_crawler/update.py --provider scholarly
      - name: Save validated snapshot
        run: |
          if ! git diff --quiet -- _data/google_scholar_citations.yml; then
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo 'Repository changed during fetching; keeping newer remote/manual edits. Retry the workflow.' >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _data/google_scholar_citations.yml
            git commit -m 'Update Google Scholar citation snapshot'
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages
        # A push made with GITHUB_TOKEN does not trigger the usual Pages build.
        # Request a build explicitly, also allowing a manual retry after failure.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
