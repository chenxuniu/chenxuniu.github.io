# Newest first. Rendered on the homepage (_includes/news-list.html) and by the
# terminal's `news` command. `before` and `after` may contain inline HTML.
# `link.url` is a URL; `link.paper` is a slug from _data/publications.yml and links to that paper's page.
# If the slug matches no paper, `link.url` is used instead, and without one the text is not linked.
- date: "2026-09"
  logo: "/images/icons/conferences/neurips-2026.png"
  before: "Our paper"
  link:
    text: "The 1/W Law: Context Length is the Dominant Energy Lever in LLM Inference Fleets."
    paper: "one-over-w-law"
    emphasis: true
  after: "has been accepted at <strong>NeurIPS 2026</strong>; the camera-ready PDF is on the paper page."

